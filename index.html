<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Leaflet JS</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        .legend {
            padding: 8px;
            background: white;
            line-height: 18px;
            border-radius: 5px;
        }

        .legend i {
            width: 18px;
            height: 18px;
            float: left;
            margin-right: 8px;
        }
    </style>

</head>


<body>

    <div id="map"></div>


    <!-- jQuery -->

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <!-- Leaflet -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="">
        </script>


    <script>


        // =====================================================
        // INISIALISASI PETA
        // =====================================================

        var map = L.map("map").setView(
            [-8.2848467, 123.1649780],
            10
        );


        // =====================================================
        // BASEMAP
        // =====================================================

        var basemap = L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution:
                    '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }
        );


        basemap.addTo(map);


        // =====================================================
        // GEOJSON POINT TOPONIMI
        // =====================================================

        var toponimi = L.geoJSON(null, {

            // Custom Marker
            pointToLayer: function (feature, latlng) {

                return L.marker(latlng, {

                    icon: L.icon({

                        iconUrl: "home_marker.png",

                        iconSize: [48, 48],

                        iconAnchor: [24, 48],

                        popupAnchor: [0, -48],

                        tooltipAnchor: [-16, -30]

                    })

                });

            },


            // onEachFeature
            onEachFeature: function (feature, layer) {


                // Popup content
                var popup_content =

                    "Nama: " +
                    feature.properties.TOPONIMI +

                    "<br>" +

                    "Koordinat: " +
                    feature.geometry.coordinates[1] +
                    ", " +
                    feature.geometry.coordinates[0] +

                    "<br>" +

                    "<img src='images/" +
                    feature.properties.image +
                    "' alt='' width='200'>";


                layer.on({

                    // Click untuk popup
                    click: function () {

                        layer.bindPopup(
                            popup_content
                        ).openPopup();

                    },


                    // Mouseover untuk tooltip
                    mouseover: function () {

                        layer.bindTooltip(
                            feature.properties.TOPONIMI,
                            {
                                direction: "top",
                                sticky: true
                            }
                        ).openTooltip();

                    },


                    // Mouseout
                    mouseout: function () {

                        layer.closeTooltip();

                    }

                });

            }

        });


        // Load GeoJSON Toponimi

        $.getJSON(
            "geojson/toponimi.geojson",

            function (data) {

                toponimi.addData(data);

                map.addLayer(toponimi);

            }

        );


        // =====================================================
        // GEOJSON LINE JALAN
        // =====================================================

        var jalan = L.geoJSON(null, {

            // Style Jalan
            style: function () {

                return {

                    color: "red",

                    weight: 3

                };

            },


            // onEachFeature
            onEachFeature: function (feature, layer) {

                // Popup Jalan
                var popup_content =

                    "Fungsi: " +
                    feature.properties.NAMA_UNSUR +

                    "<br>" +

                    "Panjang (km): " +
                    feature.properties.panjang_km;


                layer.on({

                    // Click untuk popup
                    click: function () {

                        layer.bindPopup(
                            popup_content
                        ).openPopup();

                    }

                });

            }

        });


        // Load GeoJSON Jalan

        $.getJSON(
            "geojson/jalan.geojson",

            function (data) {

                jalan.addData(data);

                map.addLayer(jalan);

            }

        );


        // =====================================================
        // GRADUATED SYMBOLOGY
        // JUMLAH PENDUDUK
        // =====================================================

        function getColor(penduduk) {

            return penduduk > 34380 ? "#800026" :

                penduduk > 27064 ? "#BD0026" :

                    penduduk > 19748 ? "#E31A1C" :

                        penduduk > 12432 ? "#FC4E2A" :

                            "#FD8D3C";

        }


        // =====================================================
        // GEOJSON POLYGON JUMLAH PENDUDUK
        // =====================================================

        var jumlah_penduduk = L.geoJSON(null, {

            // Graduated Symbology
            style: function (feature) {

                var penduduk =
                    Number(feature.properties.Penduduk);


                return {

                    fillColor: getColor(penduduk),

                    color: "black",

                    weight: 1,

                    fillOpacity: 1

                };

            },


            // onEachFeature
            onEachFeature: function (feature, layer) {

                var penduduk =
                    Number(feature.properties.Penduduk);


                // Popup Jumlah Penduduk
                layer.bindPopup(

                    "<b>" +
                    feature.properties.WADMKC +
                    "</b><br><br>" +

                    "Jumlah Penduduk: " +

                    penduduk.toLocaleString("id-ID") +

                    " jiwa"

                );


                layer.on({

                    // Mouseover untuk tooltip
                    mouseover: function () {

                        layer.bindTooltip(
                            feature.properties.WADMKC,
                            {
                                direction: "center",
                                sticky: true
                            }
                        ).openTooltip();

                    },


                    // Mouseout
                    mouseout: function () {

                        layer.closeTooltip();

                    },


                    // Click untuk popup
                    click: function () {

                        layer.openPopup();

                    }

                });

            }

        });


        // Load GeoJSON Jumlah Penduduk

        $.getJSON(
            "geojson/jumlah_penduduk.geojson",

            function (data) {

                jumlah_penduduk.addData(data);

                map.addLayer(jumlah_penduduk);

                map.fitBounds(
                    jumlah_penduduk.getBounds()
                );

            }

        );


        // =====================================================
        // LAYER CONTROL
        // =====================================================

        var baseMaps = {

            "OpenStreetMap": basemap

        };


        var overlayMaps = {

            "Toponimi": toponimi,

            "Jalan": jalan,

            "Jumlah Penduduk": jumlah_penduduk

        };


        L.control.layers(

            baseMaps,

            overlayMaps,

            {
                collapsed: false
            }

        ).addTo(map);


        // =====================================================
        // LEGEND
        // =====================================================

        var legend = L.control({

            position: "bottomright"

        });


        legend.onAdd = function () {

            var div = L.DomUtil.create(
                "div",
                "legend"
            );


            div.innerHTML =

                "<b>Jumlah Penduduk</b><br>" +

                '<i style="background:#FD8D3C"></i>' +
                "5.117 – 12.433<br>" +

                '<i style="background:#FC4E2A"></i>' +
                "12.433 – 19.749<br>" +

                '<i style="background:#E31A1C"></i>' +
                "19.749 – 27.064<br>" +

                '<i style="background:#BD0026"></i>' +
                "27.064 – 34.380<br>" +

                '<i style="background:#800026"></i>' +
                "34.380 – 41.696";


            return div;

        };


        legend.addTo(map);


    </script>

</body>

</html>
